<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unspoken preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1e26; font-family: system-ui; }
  .phone { width: 393px; height: 852px; border-radius: 54px; padding: 12px; background: #0a0a0c; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #2a2d36; position: relative; }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 44px; background: #000; }
  .notch { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #0a0a0c; }
</style>
</head>
<body>
  <div class="phone"><iframe id="f" src="/" allow="microphone"></iframe><div class="notch"></div></div>
  <script>document.getElementById('f').addEventListener('load', e => { const d = e.target.contentDocument; if (d) { d.documentElement.style.setProperty('--sat', '52px'); d.documentElement.style.setProperty('--sab', '24px'); const st = d.createElement('style'); st.textContent = '.word,.feedback,.result-row,.check path{animation-duration:.01s!important}'; d.head.appendChild(st); } });
const q = new URLSearchParams(location.search); const h = q.get('hash'); if (h) document.getElementById('f').src = '/#/' + h;</script>
</body>
</html>
